{% for line in log_lines %}
<div class="whitespace-pre-wrap leading-relaxed hover:bg-slate-900/60 px-2 py-0.5 rounded log-line {% if '[Dash]' in line %}text-sky-300 bg-sky-950/25 font-medium{% elif '[Discord]' in line %}text-indigo-300 bg-indigo-950/25 font-medium{% elif 'ERROR' in line or 'CRITICAL' in line %}text-red-400 bg-red-950/20{% elif 'WARNING' in line %}text-amber-300{% elif 'DEBUG' in line %}text-slate-500{% else %}text-slate-200{% endif %}">{{ line }}</div>
{% else %}
<div class="text-slate-500 py-8 text-center" id="no-logs-msg">{{ t('no_logs_found') }}</div>
{% endfor %}
