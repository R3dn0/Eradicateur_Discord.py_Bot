{% extends "base.html" %}

{% block title %}Login - Eradicateur Dashboard{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="bg-darkcard border border-darkborder p-8 rounded-2xl shadow-2xl max-w-md w-full">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-950 border border-indigo-700 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                🔐
            </div>
            <h1 class="text-2xl font-extrabold text-white">Eradicateur Admin</h1>
            <p class="text-sm text-slate-400 mt-1">Enter your Dashboard password (DASHBOARD_TOKEN)</p>
        </div>

        {% if error %}
        <div class="mb-4 bg-red-950/80 border border-red-800 text-red-300 px-4 py-3 rounded-lg text-sm flex items-center space-x-2">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label for="token" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Password / Token
                </label>
                <input 
                    type="password" 
                    id="token" 
                    name="token" 
                    placeholder="••••••••••••••••" 
                    required 
                    autofocus
                    class="w-full bg-slate-900 border border-darkborder rounded-lg px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-lg transition duration-150 shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2"
            >
                <span>Login</span>
                <span>➔</span>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Protected by encrypted session cookie &bull; ProtonPass ready
        </div>
    </div>
</div>
{% endblock %}
