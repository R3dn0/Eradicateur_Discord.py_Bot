{% extends "base.html" %}

{% block title %}Player Balances - {{ current_guild.name }}{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-black text-white flex items-center gap-2">
                💰 Player Balances & Wallets
            </h1>
            <p class="text-xs text-slate-400 mt-1">
                Total Guild Debt: <span class="font-bold text-amber-400 font-mono">{{ total_owed | format_number }} Silvers</span>
            </p>
        </div>
        <button 
            onclick="openTransactionModal('', '', 'credit')" 
            class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow flex items-center space-x-2"
        >
            <span>+ New Manual Transaction</span>
        </button>
    </div>

    <!-- Search & Filters -->
    <div class="bg-darkcard border border-darkborder rounded-2xl p-4 shadow flex items-center gap-4">
        <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                🔍
            </span>
            <input 
                type="text" 
                name="q" 
                value="{{ query }}"
                placeholder="Search by username or Discord ID..." 
                hx-get="/guild/{{ current_guild.id }}/balances"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#balances-table-container"
                class="w-full bg-slate-900 border border-darkborder rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
        </div>
    </div>

    <!-- Balances Table Container -->
    <div id="balances-table-container" class="bg-darkcard border border-darkborder rounded-2xl shadow overflow-hidden">
        {% include "partials/balances_table.html" %}
    </div>
</div>

<!-- Manual Transaction Modal -->
<div id="txModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-darkcard border border-darkborder rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-5">
        <div class="flex items-center justify-between">
            <h3 id="modalTitle" class="text-lg font-bold text-white">Balance Operation</h3>
            <button onclick="closeTransactionModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>

        <form method="POST" action="/guild/{{ current_guild.id }}/balances/transaction" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Operation Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center space-x-2 bg-slate-900 border border-darkborder p-3 rounded-xl cursor-pointer">
                        <input type="radio" name="operation" value="credit" id="opCredit" checked class="text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm font-medium text-emerald-400">+ Credit</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-slate-900 border border-darkborder p-3 rounded-xl cursor-pointer">
                        <input type="radio" name="operation" value="debit" id="opDebit" class="text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm font-medium text-red-400">- Debit</span>
                    </label>
                </div>
            </div>

            <div>
                <label for="modalDiscordId" class="block text-xs font-semibold text-slate-300 uppercase mb-1">Player Discord ID</label>
                <input 
                    type="number" 
                    id="modalDiscordId" 
                    name="discord_id" 
                    required 
                    placeholder="e.g. 123456789012345678"
                    class="w-full bg-slate-900 border border-darkborder rounded-xl px-4 py-2.5 text-sm text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                <p id="modalPlayerName" class="text-xs text-indigo-400 mt-1 font-medium"></p>
            </div>

            <div>
                <label for="modalAmount" class="block text-xs font-semibold text-slate-300 uppercase mb-1">Amount (Silvers)</label>
                <input 
                    type="number" 
                    id="modalAmount" 
                    name="amount" 
                    min="1" 
                    required 
                    placeholder="e.g. 500000"
                    class="w-full bg-slate-900 border border-darkborder rounded-xl px-4 py-2.5 text-sm text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div>
                <label for="modalReason" class="block text-xs font-semibold text-slate-300 uppercase mb-1">Transaction Reason</label>
                <input 
                    type="text" 
                    id="modalReason" 
                    name="reason" 
                    required 
                    placeholder="e.g. Loot adjustment / Refund / Bonus"
                    class="w-full bg-slate-900 border border-darkborder rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div class="flex items-center justify-end space-x-3 pt-2">
                <button type="button" onclick="closeTransactionModal()" class="px-4 py-2 rounded-xl text-sm text-slate-400 hover:text-white">
                    Cancel
                </button>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow transition">
                    Confirm Operation
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function openTransactionModal(discordId, name, operation) {
        document.getElementById('modalDiscordId').value = discordId || '';
        document.getElementById('modalPlayerName').innerText = name ? 'Member: ' + name : '';
        if (operation === 'debit') {
            document.getElementById('opDebit').checked = true;
            document.getElementById('modalTitle').innerText = 'Debit Player';
        } else {
            document.getElementById('opCredit').checked = true;
            document.getElementById('modalTitle').innerText = 'Credit Player';
        }
        document.getElementById('txModal').classList.remove('hidden');
    }

    function closeTransactionModal() {
        document.getElementById('txModal').classList.add('hidden');
    }
</script>
{% endblock %}
